server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Trophy images are shared by the ranking, cabinet and player profiles.
    location /puchary/ {
        try_files $uri =404;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
